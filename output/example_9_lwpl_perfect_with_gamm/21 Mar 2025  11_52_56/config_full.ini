[Output]
saveresults = yes
savefigures = yes
showfigures = yes
figurerenderer = browser
copyconfig = yes
resultsdownsamplerate = 10
outputdownsamplerate = 10
resultspath = output/grav_testing_final/
appenddatefolder = yes
displayinfo = error
displayinterval = 1.0

[Database]
dteddatabase = databases/dted/
geoiddatabase = databases/geoid/
gpsdatabase = databases/gps/
geosatgravitydatabase = databases/gravity/geosat/
marinegravitydatabase = databases/gravity/marine/
ggmplusgravitydatabase = databases/gravity/ggmPlus/
srtm2gravitydatabase = databases/gravity/srtm2gravity/
irishseagravitydatabase = databases/gravity/irishSea/

[Waypoints]
waypointfrequency = 200
waypointinterpolation = pchip
waypointmode = config
waypointconfig = config/waypoints/Liverpool_Warrington_Preston.ini
waypointcsv = resources/waypoints/Salisbury_to_Andover.csv
invertcsvlatlon = no
ignorecsvtimes = no
usevirtualmemory = no
waypointlat = 53.407579, 53.410000, 53.700000, 53.407579
waypointlon = -2.967853, -2.70000, -2.80000, -2.967853
waypointalt = 1000.0, 1000.0, 1000.0, 1000.0

[Racetrack]
distancex = 1000.0
distancey = 1000.0
distancez = 1000.0
circuittime = 360.0
maxtime = 1000.0
startx = 0.0
starty = 0.0
startz = 0.5
numvariationsy = 2
numvariationsz = 3
latorigin = 0
lonorigin = 0
altorigin = 100

[Vehicle]
vehicleconfig = config/vehicles/basic.ini
leverarmanglex = 0.0
leverarmangley = 0.0
leverarmanglez = 0.0
sensoranglex = 0.0
sensorangley = 0.0
sensoranglez = 0.0
applyfullvehicleprofile = no
vehiclename = Generic Aircraft
averagespeed = 100.0			   			# The scalar velocity of the vehicle (metres/sec)
maxturnrate = 5.0    						# Maximum turn rate of vehicle (degrees/sec)
maxacceleration = 2.0						# Maximum acceleration of vehicle (metres/sec^2)
maxdeceleration = 1.0						# Maximum deceleration of vehicle (metres/sec^2) (+ve for braking)
timedelayacceleration = 1.0 				# Time delay constant for acceleration/deceleration (seconds)
timedelayturning = 5.0						# Time delay constant for turning rates (seconds)
pitchconstantoffset = 0.0					# The constant pitch offset (degrees)
pitchoscperiod = 0.0						# The pitch oscillation period (seconds)
pitchoscmagnitude = 0.0						# The pitch oscillation magnitude(degrees)
