[Output]
saveresults = yes
savefigures = yes
showfigures = yes
saveformat = csv
figureformat = png
figurerenderer = browser
copyconfig = yes
resultsdownsamplerate = 10
outputdownsamplerate = 10
resultspath = output/examples/example_4_perfect_ship/
appenddatefolder = yes
displayinfo = error
displayinterval = 2.5

[Database]
dteddatabase = databases/dted/
geoiddatabase = databases/geoid/
gpsdatabase = databases/gps/
geosatgravitydatabase = databases/gravity/geosat/
marinegravitydatabase = databases/gravity/marine/
ggmplusgravitydatabase = databases/gravity/ggmPlus/
srtm2gravitydatabase = databases/gravity/srtm2gravity/
irishseagravitydatabase = databases/gravity/irishSea/

[Waypoints]
waypointfrequency = 50
waypointinterpolation = pchip
waypointmode = config
waypointconfig = config/waypoints/Liverpool_Warrington_Preston.ini
waypointcsv = resources/waypoints/Salisbury_to_Andover.csv
invertcsvlatlon = no
ignorecsvtimes = no
usevirtualmemory = no
waypointlat = 53.407579, 53.410000, 53.700000, 53.407579
waypointlon = -2.967853, -2.70000, -2.80000, -2.967853
waypointalt = 1000.0, 1000.0, 1000.0, 1000.0

[Racetrack]
distancex = 1000.0
distancey = 1000.0
distancez = 1000.0
circuittime = 360.0
maxtime = 1000.0
startx = 0.0
starty = 0.0
startz = 0.5
numvariationsy = 2
numvariationsz = 3
latorigin = 0
lonorigin = 0
altorigin = 100

[Vehicle]
vehicleconfig = config/vehicles/large_ship.ini
leverarmanglex = 0.0
leverarmangley = 0.0
leverarmanglez = 0.0
sensoranglex = 0.0
sensorangley = 0.0
sensoranglez = 0.0
vehiclename = Large Ship
averagespeed = 11.00			   			# The scalar velocity of the vehicle (metres/sec)
maxturnrate = 0.5    						# Maximum turn rate of vehicle (degrees/sec)
maxacceleration = 0.1*9.81				    # Maximum acceleration of vehicle (metres/sec^2)
maxdeceleration = 0.1*9.81					# Maximum deceleration of vehicle (metres/sec^2) (+ve for braking)
timedelayacceleration = 2.0 				# Time delay constant for acceleration/deceleration (seconds)
timedelayturning = 2.0						# Time delay constant for turning rates (seconds)
pitchconstantoffset = 0.0					# The constant pitch offset (degrees)
pitchoscperiod = 6.0						# The pitch oscillation period (seconds)
pitchoscmagnitude = 0.5						# The pitch oscillation magnitude(degrees)
pitchmax = 2.5				    			# The maximum pitch limit (degrees)
rollconstantoffset = 0.0 					# The constant roll offset (degrees)
rolloscperiod = 10.0 		 				# The roll oscillation period (seconds)
rolloscmagnitude = 2.0 						# The roll oscillation magnitude(degrees)
rollmax = 5.0								# The maximum roll limit (degrees)
rollturnrate = -5.0								# The maximum roll limit (degrees)/0.5    						# Maximum turn rate of vehicle (degrees/sec) 	# The rolling turn rate (seconds)
vibrationnoiseacceleration = 0.05 			# The vibration acceleration noise (m/s^2.sqrt(Hz))
vibrationnoiseanglerates = 0.5				# The vibration angle rate noise (deg/s.sqrt(Hz))
vibrationdampingperiod = 1.0				# The vibration dampening period (seconds)

[Gravity]
autodownload = true
truegravityfunction = somigliana
truegravitymapmodel = none
truegravitydownsampling = 1
estimatedgravityfunction = somigliana
estimatedgravitymapmodel = none
estimatedgravitydownsampling = 1

[Measurement]
imumeasurementfreq = 500
accelerometerconfig = config/accelerometers/perfect.ini
gyroscopeconfig = config/gyroscopes/perfect.ini
clockconfig = config/clocks/perfect.ini
accelerometerbiasdriftrate = 0.0                     # (micro-g/root sec)
accelerometerscaleerrormean = 0.0                    # (ppm)
accelerometermeasurementerror = 0.0                  # (micro-g.root Hz)
accelerometernonorthogonalitymean = 0.0              # (micro-radians)
accelerometerinitialstaticbiasmean = 0.0             # (micro-g)
gyroscopebiasdriftrate = 0.0                    	# (micro-rad/sec.root sec)
gyroscopescaleerrormean = 0.0                   	# (ppm)
gyroscopemeasurementerror = 0.0                 	# (micro-radians/sec.root Hz)
gyroscopenonorthogonalitymean = 0.0             	# (micro-radians)
gyroscopeinitialstaticbiasmean = 0.0            	# (micro-radians/sec)
clockinitialbias = 0.0                          # (nano-sec)
clockbiasdriftrate = 0.0                   		# (nano-sec/root sec)
clockinitialstaticbiasmean = 0.0           		# (standard deviation)

[Estimation]
estimatedstatemodel = simple
integrationmethod = numerical
initialpositionerrornorth = 0.0
initialpositionerroreast = 0.0
initialpositionerrordown = 0.0
initialvelocityerrornorth = 0.0
initialvelocityerroreast = 0.0
initialvelocityerrordown = 0.0
initialaccelerationerrornorth = 0.0
initialaccelerationerroreast = 0.0
initialaccelerationerrordown = 0.0
initialattitudeerrorheading = 0.0
initialattitudeerrorpitch = 0.0
initialattitudeerrorroll = 0.0
initialanglerateerrorheading = 0.0
initialanglerateerrorpitch = 0.0
initialanglerateerrorroll = 0.0
accelerometerconfig = config/accelerometers/perfect.ini
gyroscopeconfig = config/gyroscopes/perfect.ini
clockconfig = config/clocks/perfect.ini
usevirtualmemory = no
accelerometerbiasdriftrate = 0.0                     # (micro-g/root sec)
accelerometerscaleerrormean = 0.0                    # (ppm)
accelerometermeasurementerror = 0.0                  # (micro-g.root Hz)
accelerometernonorthogonalitymean = 0.0              # (micro-radians)
accelerometerinitialstaticbiasmean = 0.0             # (micro-g)
gyroscopebiasdriftrate = 0.0                    	# (micro-rad/sec.root sec)
gyroscopescaleerrormean = 0.0                   	# (ppm)
gyroscopemeasurementerror = 0.0                 	# (micro-radians/sec.root Hz)
gyroscopenonorthogonalitymean = 0.0             	# (micro-radians)
gyroscopeinitialstaticbiasmean = 0.0            	# (micro-radians/sec)
clockinitialbias = 0.0                          # (nano-sec)
clockbiasdriftrate = 0.0                   		# (nano-sec/root sec)
clockinitialstaticbiasmean = 0.0           		# (standard deviation)

[Altimeter]
altimeterenabled = yes
altimeterconfig = config/altimeters/perfect.ini
altimeterfusion = fixed_gain
altimetergainamount = 0.1									# (fixed gain filter amount)
altimeteralphaamount = 0.9
altimeterbetaamount = 0.05
altimeterautosetbeta = false
altimeterbiasdriftrate = 0.0                             	# (metres/root sec)
altimetermeasurementfreq = 1.0                           	# (hz)
altimetermeasurementerror = 0.0                          	# (metres)
altimeterinitialstaticbiasmean = 0.0                     	# (metres above sea level)

[GPS]
gpsenabled = no
gpsautodownload = yes
gpstimeyear = 2019
gpstimemonth = 2
gpstimeday = 25
gpsmeasurementfreq = 1.0
gpsrhonoise = 0
gpsrhoratenoise = 0
gpsfusionmethod = fixed_gain
gpsfixedgain = 5e-2
gpsinititerations = 3
gpssigmaposition = 1
gpssigmavelocity = 0.3

[Quantum]
quantumimuenabled = no
quantumimusensor = realistic
quantumimufusion = basic
quantumimuconfig = config/quantum_imu/custom.ini
quantumimufrequency = 1.0		            # The total operating frequency of the sensor (Hz).
quantumimudutycycle = 0.5		            # Percentage of time the sensor is active (measuring).
quantumaccxenabled = yes
quantumaccyenabled = yes
quantumacczenabled = yes
quantumaccbiasdriftrate = 0.0               # The quantum accelerometer's drift rate (micro-g/root sec)
quantumaccscaleerrormean = 0.0              # The quantum accelerometer's average scale error (ppm)
quantumaccmeasurementerror = 0.0            # The quantum accelerometer's measurement error (micro-g.root Hz)
quantumaccnonorthogonalitymean = 0.0        # The quantum accelerometer's non-orthogonal mean error (micro-radians)
quantumaccinitialstaticbiasmean = 0.0       # The quantum accelerometer's initial static bias error (micro-radians/sec)
quantumgyroxenabled = yes
quantumgyroyenabled = yes
quantumgyrozenabled = yes
quantumgyrobiasdriftrate = 0.0              # The quantum gyroscope's drift rate (micro-rad/sec.root sec)
quantumgyroscaleerrormean = 0.0             # The quantum gyroscope's average scale error (ppm)
quantumgyromeasurementerror = 0.0           # The quantum gyroscope's measurement error  (micro-radians/sec.root Hz)
quantumgyrononorthogonalitymean = 0.0       # The quantum gyroscope's non-orthogonal mean error (micro-radians)
quantumgyroinitialstaticbiasmean = 0.0      # The quantum gyroscope's initial static bias error(micro-radians/sec)
quantumimunumparticles = 2000
quantumimusigmamisalignment = 0.1
quantumimusigmaaccelerometer = 0.2
quantumimusigmagyroscope = 0.1
quantumimumisalignment = 0.1
quantumimuhasmisalignment = no
quantumimunumatoms = 1e6                    # The number of atoms in cloud to use for each measurement
quantumimuatommass = 2.20693925e-25         # The mass of each of the atoms (in kilograms)
quantumimubeamwidth = 2.5                   # The interferometer beam width (metres). [Delta_x]
quantumimulength = 2.5                      # The length of the interferometer (metres). [Delta_z]
quantumimueta = 1.0                         # The detection efficiency for measurements. [eta]
quantumimutimepulse = 0.25                  # The time between pulses (seconds). [T_pulse]
quantumimuatomrecoilvec = 7.0e-3            # The recoil velocity of the cold atoms. [v_rec]

[Holonomics]
useholonomics = yes
correctionfreq = 200
positiongain = 0.001
positionaxis = 0,0,1
velocitygain = 0
velocityaxis = 1,1,1
accelerationgain = 0
accelerationaxis = 1,1,1
attitudegain = 0
attitudeaxis = 1,1,1
anglerategain = 0
anglerateaxis = 1,1,1

[Random]
initialrandomseed = 0
autogenerateinitialseed = no
waypointrandomseed = 0
autogeneratewaypointseed = no
simulationrandomseed = 0
autogeneratesimulationseed = no
errorrandomseed = 0
autogenerateerrorseed = no

[Misc]
allowconfigoverloading = no
displayfallbackwarnings = no
performauditing = no
auditloggingfile = audit.csv

