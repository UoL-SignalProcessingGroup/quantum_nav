distancey = 1000.0
distancez = 1000.0
circuittime = 360.0
maxtime = 1000.0
startx = 0.0
starty = 0.0
startz = 0.5
numvariationsy = 2
numvariationsz = 3
latorigin = 0
lonorigin = 0
altorigin = 100

[Vehicle]
vehicleconfig = config/vehicles/basic.ini
leverarmanglex = 0.0
