# --------------------------------------------------------------------------- #
#                       ACCELEROMETER SETTINGS - CUSTOM                       #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for an        # 
# accelerometer. This given configuration is used to simulate perfect         #
# accuracy with no error growth. While unrealistic, this model is ideal for   #
# testing and comparing other configurations.                                 #
# --------------------------------------------------------------------------- #

[Accelerometer]
accelerometerBiasDriftRate = 0.0                     # (micro-g/root sec)
accelerometerScaleErrorMean = 0.0                    # (ppm)
accelerometerMeasurementError = 0.0                  # (micro-g.root Hz)
accelerometerNonOrthogonalityMean = 0.0              # (micro-radians)
accelerometerInitialStaticBiasMean = 0.001           # (micro-g)
