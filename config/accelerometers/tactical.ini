# --------------------------------------------------------------------------- #
#                       ACCELEROMETER SETTINGS - TACTICAL                     #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for an        # 
# accelerometer. This given configuration is used to simulate the accuracy    #
# expected from tactical graded hardware.                                     #
# --------------------------------------------------------------------------- #

[Accelerometer]
accelerometerBiasDriftRate = 5.0                    	# (micro-g/root sec)
accelerometerScaleErrorMean = 250                      	# (ppm)
accelerometerMeasurementError = 60                   	# (micro-g.root Hz)
accelerometerNonOrthogonalityMean = 250              	# (micro-radians)
accelerometerInitialStaticBiasMean = 1000              	# (micro-g)
