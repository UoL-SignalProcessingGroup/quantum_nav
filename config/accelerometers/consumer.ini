# --------------------------------------------------------------------------- #
#                      ACCELEROMETER SETTINGS - CONSUMER                      #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for an        # 
# accelerometer. This given configuration is used to simulate the accuracy    #
# expected from cheaply available consumer graded hardware.                   #
# --------------------------------------------------------------------------- #

[Accelerometer]
accelerometerBiasDriftRate = 20.0                    	# (micro-g/root sec)
accelerometerScaleErrorMean = 2000                      # (ppm)
accelerometerMeasurementError = 500                   	# (micro-g.root Hz)
accelerometerNonOrthogonalityMean = 2000              	# (micro-radians)
accelerometerInitialStaticBiasMean = 3000              	# (micro-g)
