# --------------------------------------------------------------------------- #
#                        VEHICLE PARAMETERS - SUBMARINE                       #
# --------------------------------------------------------------------------- #
# This settings file contains the maneuverability parameters and constraints  #
# for a submarine vessel. These settings describe how the submarine naturally #
# moves between given waypoints.                                              #
# --------------------------------------------------------------------------- #

[Vehicle]

# The name for describing the vehicle model
vehicleName = Submarine		

averageSpeed = 10.00			   			# The scalar velocity of the vehicle (metres/sec)

maxTurnRate = 0.5    						# Maximum turn rate of vehicle (degrees/sec)
maxAcceleration = 0.05*9.81					# Maximum acceleration of vehicle (metres/sec^2)
maxDeceleration = 0.05*9.81					# Maximum deceleration of vehicle (metres/sec^2) (+ve for braking)

timeDelayAcceleration = 2.0					# Time delay constant for acceleration/deceleration (seconds)
timeDelayTurning = 2.0						# Time delay constant for turning rates (seconds)

pitchConstantOffset = 0.0					# The consent pitch offset (degrees)
pitchOscPeriod = 0.0						# The pitch oscillation period (seconds)
pitchOscMagnitude = 0.0						# The pitch oscillation magnitude (degrees)
pitchMax = 10.0				    			# The maximum pitch limit (degrees)

rollConstantOffset = 0.0 					# The constant roll offset (degrees)
rollOscPeriod = 0.0 		 				# The roll oscillation period (seconds)
rollOscMagnitude = 0.0 						# The roll oscillation magnitude (degrees)
rollMax = 5.0								# The maximum roll limit (degrees)
rollTurnRate = 0.0 							# The rolling turn rate (seconds)

vibrationNoiseAcceleration = 0.0 			# The vibration acceleration noise (m/s^2.sqrt(Hz))
vibrationNoiseAngleRates = 0.0				# The vibration angle rate noise (deg/s.sqrt(Hz))
vibrationDampingPeriod = 0.0				# The vibration dampening period (seconds)
