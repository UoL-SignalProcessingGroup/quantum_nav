# --------------------------------------------------------------------------- #
#                         GYROSCOPE SETTINGS - PERFECT                        #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for an        # 
# gyroscope. This given configuration is used to simulate perfect accuracy    #
# with no error growth. While unrealistic, this model is ideal for testing    #
# and comparing other configurations.                                         #
# --------------------------------------------------------------------------- #

[Gyroscope]
gyroscopeBiasDriftRate = 0.0                    	# (micro-rad/sec.root sec)
gyroscopeScaleErrorMean = 0.0                   	# (ppm)
gyroscopeMeasurementError = 0.0                 	# (micro-radians/sec.root Hz)
gyroscopeNonOrthogonalityMean = 0.0             	# (micro-radians)
gyroscopeInitialStaticBiasMean = 0.0            	# (micro-radians/sec)
