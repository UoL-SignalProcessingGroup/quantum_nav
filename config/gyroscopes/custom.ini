# --------------------------------------------------------------------------- #
#                         GYROSCOPE SETTINGS - CUSTOM                         #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for a         # 
# gyroscope. This given configuration is used to provide custom non-specific  #
# error values. This model is used primarily for testing.                     #
# --------------------------------------------------------------------------- #

[Gyroscope]
gyroscopeBiasDriftRate = 0.0                    	# (micro-rad/sec.root sec)
gyroscopeScaleErrorMean = 0.0                    	# (ppm)
gyroscopeMeasurementError = 0.0               		# (micro-radians/sec.root Hz)
gyroscopeNonOrthogonalityMean = 0.0             	# (micro-radians)
gyroscopeInitialStaticBiasMean = 0.00            	# (micro-radians/sec)
