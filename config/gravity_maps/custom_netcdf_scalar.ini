# Template for a rectilinear scalar gravity grid in NetCDF or GMT .grd form.
# Variable names are examples and must match the dataset being loaded.

[CustomGravityMap]
name = NetCDF gravity disturbance
crs = EPSG:4326
mode = residual
interpolation = linear
outOfBounds = base
maxCells = 5000000

[Grid]
format = netcdf
file = data/gravity_disturbance.nc
xVariable = longitude
yVariable = latitude
#heightVariable = ellipsoid_height
#heightReference = ellipsoid
#geoidUndulationVariable = geoid_undulation

[Field]
format = netcdf
file = data/gravity_disturbance.nc
representation = scalar
valueVariable = gravity_disturbance
units = mGal
quantity = gravity_disturbance
verticalDirection = down

[Subset]
coordinateFrame = wgs84
minLongitude = -10
maxLongitude = 2
minLatitude = 49
maxLatitude = 61
paddingCells = 1
