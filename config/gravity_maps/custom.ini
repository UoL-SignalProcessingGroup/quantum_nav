# Generic custom gravity-map template.
# Copy this file and replace every path and column mapping for your data.

[CustomGravityMap]
name = Example custom gravity map
crs = EPSG:3413
mode = total_minus_reference
interpolation = linear
outOfBounds = base
# Refuse an unexpectedly large selection before loading field arrays.
maxCells = 5000000

[Grid]
format = csv
file = data/coordinates.csv
xColumn = x
yColumn = y
heightColumn = ellipsoid_height
heightReference = ellipsoid
rowOrder = x_fastest

[Field]
# Frame and quantity are deliberately explicit: they describe different
# physical concepts and are not inferred from filenames or column labels.
format = csv
file = data/total_gravity.csv
northColumn = gravity_north
eastColumn = gravity_east
downColumn = gravity_down
units = mGal
frame = geocentric_ned
quantity = effective_gravity
coordinateFrame = wgs84
latitudeColumn = latitude
longitudeColumn = longitude
rowOrder = x_fastest

[Reference]
# A reference may use a different frame and quantity from the measured field.
# QNav normalizes both before subtraction.
format = csv
file = data/reference_gravity.csv
northColumn = gravity_north
eastColumn = gravity_east
downColumn = gravity_down
units = m/s2
frame = NED
quantity = gravitational_attraction
coordinateFrame = wgs84
latitudeColumn = latitude
longitudeColumn = longitude
rowOrder = x_fastest

