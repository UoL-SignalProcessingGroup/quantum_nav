# Template for a regular free-air-anomaly grid in whitespace-delimited text.
# Set header=none and use zero-based xIndex/yIndex/valueIndex for headerless
# provider files. The source rows must form a complete rectilinear grid.

[CustomGravityMap]
name = Delimited free-air anomaly
crs = EPSG:4326
mode = residual
interpolation = linear
outOfBounds = base
maxCells = 5000000

[Grid]
format = delimited
file = data/free_air.xyz
delimiter = whitespace
header = present
commentPrefix = #
xColumn = longitude
yColumn = latitude
rowOrder = x_fastest
heightReference = ellipsoid

[Field]
format = delimited
file = data/free_air.xyz
delimiter = whitespace
header = present
commentPrefix = #
representation = scalar
valueColumn = free_air_anomaly
units = mGal
quantity = free_air_anomaly
verticalDirection = down
rowOrder = x_fastest
