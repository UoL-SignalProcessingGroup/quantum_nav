# Template for a rectilinear, georeferenced scalar gravity GeoTIFF.
# Install optional readers with: pip install "qnav[maps]"

[CustomGravityMap]
name = GeoTIFF gravity disturbance
crs = EPSG:3413
mode = residual
interpolation = linear
outOfBounds = base
maxCells = 5000000

[Grid]
format = geotiff
file = data/gravity_disturbance.tif
# Optional bands may define the map surface and its vertical datum:
#heightBand = 2
#heightReference = orthometric
#geoidUndulationBand = 3

[Field]
format = geotiff
file = data/gravity_disturbance.tif
representation = scalar
valueBand = 1
units = mGal
quantity = gravity_disturbance
verticalDirection = down

[Subset]
coordinateFrame = wgs84
minLongitude = -46
maxLongitude = -44
minLatitude = 74
maxLatitude = 76
paddingCells = 1
