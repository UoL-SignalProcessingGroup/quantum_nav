# Example for a projected EPSG:3413 gravity field supplied as:
#   * a CSV grid-coordinate table;
#   * a packed MATLAB gravity field; and
#   * a CSV reference-gravity field.

[CustomGravityMap]
name = EPSG 3413 total-reference gravity example
crs = EPSG:3413
mode = total_minus_reference
interpolation = linear
outOfBounds = base
maxCells = 5000000

[Grid]
format = csv
file = data/coordinates.csv
xColumn = x EPSG3413 [m]
yColumn = y EPSG3413 [m]
heightColumn = h_geoid [m]
heightReference = geoid_surface
rowOrder = x_fastest

[Field]
format = mat
file = data/gravity_field.mat
dataVariable = gdatsum
axisOrder = component,x,y
northIndex = 1
eastIndex = 2
downIndex = 3
units = mGal
frame = geocentric_ned
quantity = effective_gravity

[Reference]
format = csv
file = data/reference_gravity.csv
northColumn = gNorth [m/s2]
eastColumn = gEast [m/s2]
downColumn = gDown [m/s2]
units = m/s2
frame = NED
quantity = gravitational_attraction
coordinateFrame = wgs84
latitudeColumn = lat [deg]
longitudeColumn = lon [deg]
rowOrder = x_fastest

