# --------------------------------------------------------------------------- #
#                         ALTIMETER SETTINGS - AVIATION                       #
# --------------------------------------------------------------------------- #
# This settings file contains the hardware configuration values for an        # 
# altimeter. This given configuration is used to simulate the accuracy        #
# expected from aviation graded hardware.                                     #
# --------------------------------------------------------------------------- #

[Altimeter]
;altimeterEnabled = yes
altimeterGainAmount = 0.1									# (fixed gain filter amount)
altimeterBiasDriftRate = 1/60                             	# (metres/root sec)
altimeterMeasurementFreq = 1.0                           	# (hz)
altimeterMeasurementError = 3.0                          	# (metres)
altimeterInitialStaticBiasMean = 1.0                     	# (metres above sea level)
