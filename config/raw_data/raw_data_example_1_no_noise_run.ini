# Raw data example 1 - no added IMU noise
#
# Integrates the clean, truth-level IMU without applying synthetic sensor
# bias, drift, scale-factor, non-orthogonality, or measurement-noise errors.

[Input]
inputMode = raw
rawDataConfig = raw_data_example_1_columns.ini

[Measurement]
imuMeasurementFreq = 500
accelerometerConfig = config/accelerometers/perfect.ini
gyroscopeConfig = config/gyroscopes/perfect.ini
useGaussianMarkovNoise = no

[Vehicle]
sensorAngleX = 0
sensorAngleY = 0
sensorAngleZ = 0
leverArmAngleX = 0
leverArmAngleY = 0
leverArmAngleZ = 0

[Estimation]
estimatedStateModel = simple
integrationMethod = numerical

[Gravity]
estimatedGravityFunction = somigliana
estimatedGravityCorrectionMap = none

[Geoid]
estimatedGeoidModel = none

[Database]
geoidDatabase = databases/geoid

[Random]
initialRandomSeed = 20260710
autoGenerateInitialSeed = no
errorRandomSeed = 20260710
autoGenerateErrorSeed = no

[Output]
resultsPath = output/raw_data_example_1_no_noise
appendDateFolder = no
resultsDownSampleRate = 50
outputDownSampleRate = 1
saveFormat = csv
copyConfig = yes
saveSummary = yes
saveProcessedImu = yes
saveFigures = yes
showFigures = no
displayInfo = none

[Misc]
displayFallbackWarnings = no
