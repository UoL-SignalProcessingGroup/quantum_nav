# Raw data example 1
#
# Runs the clean, truth-level IMU through aviation-grade sensor error models.
# Initial navigation state values were derived from the first row of
# ground_truth.csv. Later truth positions are deliberately not fused back into
# the estimate.

[Input]
inputMode = raw
rawDataConfig = raw_data_example_1_columns.ini

[Measurement]
imuMeasurementFreq = 500
accelerometerConfig = config/accelerometers/aviation.ini
gyroscopeConfig = config/gyroscopes/aviation.ini
useGaussianMarkovNoise = no

[Vehicle]
sensorAngleX = 0
sensorAngleY = 0
sensorAngleZ = 0
leverArmAngleX = 0
leverArmAngleY = 0
leverArmAngleZ = 0

[Estimation]
estimatedStateModel = simple
integrationMethod = numerical

[Gravity]
estimatedGravityFunction = somigliana
estimatedGravityCorrectionMap = none

[Geoid]
estimatedGeoidModel = none

[Database]
geoidDatabase = databases/geoid

[Random]
initialRandomSeed = 20260710
autoGenerateInitialSeed = no
errorRandomSeed = 20260710
autoGenerateErrorSeed = no

[Output]
resultsPath = output/raw_data_example_1
appendDateFolder = no
resultsDownSampleRate = 50
outputDownSampleRate = 1
saveFormat = csv
copyConfig = yes
saveSummary = yes
saveProcessedImu = yes
saveFigures = no
showFigures = no
displayInfo = none

[Misc]
displayFallbackWarnings = no
