[RawData]
file = ../../raw_data_example_1/imu_clean.csv
timeUnit = s
chunkSize = 100000
invalidRecordPolicy = strict
imuInputLevel = truth

[RawInitialState]
# First clean IMU record. Navigation position, velocity and attitude are
# initialized automatically from the first RawReference record below.
accelerationX = -0.0435533973649468
accelerationY = -0.0156975711927362
accelerationZ = -9.81313513345626
angularRateX = 0.0023338296325084705
angularRateY = -0.000966275921882056
angularRateZ = -0.0033279708295355327

[RawAccelerometer]
timestampColumn = time [s]
xColumn = ax [m/s2]
yColumn = ay [m/s2]
zColumn = az [m/s2]
accelerationUnits = m/s2
frame = body

[RawGyroscope]
timestampColumn = time [s]
xColumn = p [rad/s]
yColumn = q [rad/s]
zColumn = r [rad/s]
angularRateUnits = rad/s
frame = body

[RawReference]
file = ../../raw_data_example_1/ground_truth.csv
timestampColumn = time [s]
latitudeColumn = lat [deg]
longitudeColumn = lon [deg]
altitudeColumn = alt [m]
coordinateUnits = degrees
altitudeUnits = m
velocityXColumn = Vnorth [m/s]
velocityYColumn = Veast [m/s]
velocityZColumn = Vdown [m/s]
velocityUnits = m/s
velocityFrame = ned
quaternionWColumn = Qw []
quaternionXColumn = Qx []
quaternionYColumn = Qy []
quaternionZColumn = Qz []
quaternionDirection = bodyToNed
