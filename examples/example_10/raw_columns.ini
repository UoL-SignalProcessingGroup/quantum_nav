[RawData]
combinedFile = csv/imu_gnss.csv
timeUnit = s
chunkSize = 100000
invalidRecordPolicy = strict

[RawInitialState]
heading = 0
pitch = 0
roll = 0

[RawAccelerometer]
timestampColumn = time
xColumn = accel_x
yColumn = accel_y
zColumn = accel_z
accelerationUnits = m/s^2

[RawGyroscope]
timestampColumn = time
xColumn = gyro_x
yColumn = gyro_y
zColumn = gyro_z
angularRateUnits = deg/s

[RawGnss]
timestampColumn = time
latitudeColumn = latitude
longitudeColumn = longitude
altitudeColumn = altitude
velocityXColumn = velocity_north
velocityYColumn = velocity_east
velocityZColumn = velocity_down
velocityFrame = ned
lengthUnits = m
velocityUnits = m/s
