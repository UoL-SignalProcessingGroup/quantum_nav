# Example 10 - Raw IMU/GNSS CSV replay

[Input]
inputMode = raw
rawDataConfig = raw_columns.ini

[Measurement]
imuMeasurementFreq = 10

[Estimation]
estimatedStateModel = simple
integrationMethod = numerical

[GPS]
gpsFusionMethod = fixedgain
gpsFixedGain = 0.25

[Gravity]
estimatedGravityFunction = somigliana
estimatedGravityCorrectionMap = none

[Geoid]
estimatedGeoidModel = none

[Database]
geoidDatabase = databases/geoid

[Output]
resultsPath = output/raw_sensor_replay
appendDateFolder = no
resultsDownSampleRate = 1
outputDownSampleRate = 1
saveFormat = csv
copyConfig = yes
saveSummary = yes
saveFigures = no
showFigures = no
displayInfo = none

[Misc]
displayFallbackWarnings = no
