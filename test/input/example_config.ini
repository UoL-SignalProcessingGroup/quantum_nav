# ========================================================================== #
#                            Example Config File                             #
# ========================================================================== #
# Provides a series of example entries used to test and verify the reading   #
# of the different data types supported in a configuration file. Do not edit #
# this file as it may cause tests to influentially fail!                     #
# ========================================================================== #


[Strings]; Example string values:
stringValue1 = String
stringValue2 = A Longer String
stringValue3 = 12345678910

[Integers];  Example integer values:
intValue1 = 123
intValue2 = -56
intValue3 = 78.910

[Floats]; Example float values:
floatValue1 = 1.234567
floatValue2 = 0.0000001379
floatValue3 = -1234.6789

[Exponents]; Example exponent values:
exponentValue1 = 1e6
exponentValue2 = 1e-6
exponentValue3 = -5e-6

[Boolean]; Example boolean values:
trueBool = True
falseBool = False
onBool = yes
offBool = no
yesBool = yes
noBool = no
zeroBool = 0
oneBool = 1

[Paths]
posixPath = posix/parent_dir/file.suffix
windowsPath = windows\parent_dir\file.suffix

[Interpolated]
interpValues1 = ${Strings:stringValue1}
interpValues2 = ${Strings:stringValue1} ${Floats:floatValue1}

[SubPath]
subConfig = example_subconfig.ini
